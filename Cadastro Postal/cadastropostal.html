<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Postal</title>
    <link rel="stylesheet" href="./stylecadastropos.css">
</head>
<body>
    <form class="formulario">
        <h2>Cadastro Postal</h2>

        <div class="linha">
            <div class="campo">
                <label>CEP *</label>
                <input type="text" id="cep" value="14406-010">
            </div>
            <div class="campo">
                <label>Logradouro *</label>
                <input type="text" id="logradouro" value="Avenida Rio Amazonas">
            </div>
        </div>

        <div class="linha">
            <div class="campo">
                <label>Número *</label>
                <input type="text" id="numero" value="1405">
            </div>
            <div class="campo">
                <label>Complemento</label>
                <input type="text" id="complemento" value="Bloco 4 Apartamento 106">
            </div>
        </div>

        <div class="linha">
            <div class="campo">
                <label>Bairro *</label>
                <input type="text" id="bairro" value="Residencial Amazonas">
            </div>
            <div class="campo">
                <label>Cidade *</label>
                <input type="text" id="cidade" value="Franca">
            </div>
        </div>

        <div class="linha">
            <div class="campo">
                <label>Estado (UF) *</label>
                <input type="text" id="uf" maxlength="2" value="SP">
            </div>
            <div class="campo">
                <label>País *</label>
                <input type="text" id="pais" value="Brasil" required>
            </div>
        </div>


 <div class="botoes">
            <button type="reset">Limpar</button>
            <button type="submit">Cadastrar</button>
        </div>

    </form>

    <script>
        // Busca automática de endereço pelo CEP
        document.getElementById('cep').addEventListener('blur', function () {
            const cep = this.value.replace(/\D/g, '');
            if (cep.length === 8) {
                fetch(`https://viacep.com.br/ws/${cep}/json/`)
                    .then(response => response.json())
                    .then(data => {
                        if (!data.erro) {
                            document.getElementById('logradouro').value = data.logradouro;
                            document.getElementById('bairro').value = data.bairro;
                            document.getElementById('cidade').value = data.localidade;
                            document.getElementById('uf').value = data.uf;
                        } else {
                            alert('CEP não encontrado!');
                        }
                    })
                    .catch(() => alert('Erro ao buscar CEP.'));
            }
        });
    </script>
</body>
</html>
