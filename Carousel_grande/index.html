<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link
      rel="stylesheet"
      type="text/css"
      media="screen"
      href="./style/style.css"
    />
  </head>
  <body>
    <div class="container">
      <br />
      <br />
      <br />

      <div id="meuCarrossel" class="carousel slide" data-ride="carousel">
        <!-- Indicadores (bolinhas de navegação) -->
        <ol class="carousel-indicators">
          <li data-target="#meuCarrossel" data-slide-to="0" class="active"></li>
          <li data-target="#meuCarrossel" data-slide-to="1"></li>
          <li data-target="#meuCarrossel" data-slide-to="2"></li>
          <li data-target="#meuCarrossel" data-slide-to="3"></li>
        </ol>

        <!-- Slides -->
        <div class="carousel-inner" role="listbox">
          <div class="item active">
            <img src="./image/737617.jpg" alt="Foto 1" />
          </div>
          <div class="item">
            <img src="./image/the-grandiose-architecture-of-luxembourg-city-uddx9ywwqafh9ilj.jpg" alt="Foto 2" />
          </div>
          <div class="item">
            <img src="./image/eiffel-tower-at-sunset-paris-france-uhd-4k-wallpaper.jpg" alt="Foto 3" />
          </div>
        </div>

        <!-- Controles (setas esquerda/direita) -->
        <a class="left carousel-control" href="#meuCarrossel" role="button" data-slide="prev">
          <span class="glyphicon glyphicon-chevron-left" aria-hidden="true" ></span>
          <span class="sr-only">Anterior</span>
        </a>

        <a class="right carousel-control" href="#meuCarrossel" role="button" data-slide="next">
          <span class="glyphicon glyphicon-chevron-right" aria-hidden="true" ></span>
          <span class="sr-only">Próximo</span>
        </a>

      </div>
    </div>
    <script src="./js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  </body>
</html>
