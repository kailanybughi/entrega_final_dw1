<div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

      labels: ['Algorítmos', 'Engenharia de S.', 'Design Digital', 'Desenvolvimento W.', 'Sist. Operacionais', 'Modelagem de Dados'],

        backgroundColor: 'rgba(160, 90, 255, 0.6)'

        }
      }
    }
